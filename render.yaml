services:
  - type: web
    name: parsertt-bot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VK_APP_ID
        sync: false
      - key: VK_ACCESS_TOKEN
        sync: false
      - key: BOT_MODE
        value: auto
